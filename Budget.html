<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget - FinTrack</title>
    <link rel="stylesheet" href="Budget.css">
</head>
<body>
    <div class="container">
        <h1>My Budget</h1>
        <p>Track your monthly spending and savings.</p>

        <div class="summary">
            <div class="card">
                <h3>Monthly Budget</h3>
                <h2>₹30,000</h2>
            </div>

            <div class="card">
                <h3>Total Spent</h3>
                <h2>₹18,500</h2>
            </div>

            <div class="card">
                <h3>Remaining</h3>
                <h2>₹11,500</h2>
            </div>
        </div>

        <div class="card">
            <h3>Budget Overview</h3>
            <p>Monthly spending progress</p>
            <div class="progress">
                <div class="bar"></div>
            </div>
            <p>62% of your budget used</p>
        </div>

        <div class="card">
            <h3>Set Monthly Budget</h3>
            <label>Budget Amount (₹)</label>
            <input type="number" placeholder="Enter budget amount">

            <label>Category</label>
            <select>
                <option>Food</option>
                <option>Shopping</option>
                <option>Transport</option>
                <option>Education</option>
                <option>Entertainment</option>
            </select>

            <button>Save Budget</button>
        </div>
    </div>
</body>
</html>
