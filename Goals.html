<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Goals</title>
    <link rel="stylesheet" href="Goals.css">
</head>
<body>

    <aside class="sidebar">
        <h2>FinTrack</h2>
        <p class="menu-title">MAIN MENU</p>

        <a href="Dashboard.html">Dashboard</a>
        <a href="Accounts.html">Accounts</a>
        <a href="Transactions.html">Transactions</a>
        <a href="Analytics.html">Analytics</a>
        <a href="Goals.html" class="active">Goals</a>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Savings Goals</h1>
                <p>Plan your savings and achieve your dreams.</p>
            </div>
            <span class="profile">My Finance</span>
        </header>

        <section class="summary">
            <div class="card">
                <p>Total Target</p>
                <h2 id="totalTarget">₹0</h2>
            </div>
            <div class="card">
                <p>Total Saved</p>
                <h2 id="totalSaved">₹0</h2>
            </div>
            <div class="card">
                <p>Remaining Amount</p>
                <h2 id="remainingAmount">₹0</h2>
            </div>
        </section>

        <section class="goal-form">
            <h2>Create a New Goal</h2>

            <form id="goalForm">
                <input type="text" id="goalName"
                       placeholder="Goal name (e.g. New Laptop)" required>

                <input type="number" id="goalTarget"
                       placeholder="Target amount (₹)"
                       min="1" step="0.01" required>

                <input type="number" id="initialSaved"
                       placeholder="Already saved (₹)"
                       min="0" step="0.01" value="0" required>

                <input type="date" id="goalDate" required>

                <button type="submit">+ Create Goal</button>
            </form>
        </section>

        <section class="goals-section">
            <h2>Your Goals</h2>
            <div id="goalsList" class="goals-grid"></div>
        </section>

        <section class="activity">
            <h2>Recent Goal Activity</h2>
            <div id="goalActivity">
                <p>No savings activity yet.</p>
            </div>
        </section>
    </main>

    <script src="Goals.js"></script>
</body>
</html>
